<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>狂野印第安對決 · 槍口頂帽</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#071020}
    html.transparent,html.transparent body{background:transparent}
    body{display:grid;place-items:start center}
    .banner{position:relative;width:min(100vw,1240px);aspect-ratio:620/272}
    .spine-player{position:relative;width:100%;height:100%;overflow:hidden}
    .spine-player-canvas{display:block;width:100%;height:100%}
    .spine-player-hidden,.spine-player-controls{display:none!important}
    .spine-player-error{position:absolute;inset:0;display:grid;place-content:center;color:#ffda9a;background:#200904;font:16px sans-serif}
    .spine-player-error.spine-player-hidden{display:none}
  </style>
</head>
<body>
  <main class="banner" data-spine-player data-spine-base="./banner" data-spine-version="20260907-common-player" role="img" aria-label="狂野印第安對決。牛仔以槍口輕頂帽簷，抬帽停留後放回，持續循環。"></main>
  <script>
    const params=new URLSearchParams(location.search);
    if(params.has('transparent'))document.documentElement.classList.add('transparent');
  </script>
  <script src="../shared/common-spine-player.js"></script>
</body>
</html>
