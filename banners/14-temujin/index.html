<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>鐵木真 · 橫式遊戲 Banner</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#071020}
    html.transparent,html.transparent body{background:transparent}
    body{display:grid;place-items:start center}
    .banner{position:relative;width:min(100vw,1240px);aspect-ratio:620/272}
    .spine-player{position:relative;width:100%;height:100%;overflow:hidden}
    .spine-player-canvas{display:block;width:100%;height:100%}
    .spine-player-hidden,.spine-player-controls{display:none!important}
    .spine-player-error{position:absolute;inset:0;display:grid;place-content:center;color:#ffda9a;background:#200904;font:16px sans-serif}
    .spine-player-error.spine-player-hidden{display:none}
  </style>
</head>
<body>
  <main class="banner" id="banner" role="img" aria-label="鐵木真，一代天驕，征戰天下。武將呼吸抬臂、Q 版角色揮刀、戰火與煙霧向側上方飄移。"></main>
  <script src="./spine-player.js"></script>
  <script src="./banner-data.js?v=20260903-drifting-fire"></script>
  <script>
    if(new URLSearchParams(location.search).has('transparent'))document.documentElement.classList.add('transparent');
    const content = window.temujinBanner;
    const rawDataURIs = {
      'banner.json':'data:application/json;base64,'+btoa(unescape(encodeURIComponent(JSON.stringify(content.skeleton)))),
      'banner.atlas':'data:text/plain;base64,'+btoa(content.atlas)
    };
    const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const player=new spine.SpinePlayer('banner',{
      jsonUrl:'banner.json',atlasUrl:'banner.atlas',rawDataURIs,
      animation:'animation',loop:true,alpha:true,premultipliedAlpha:false,
      showControls:false,backgroundColor:'#00000000',fullScreenBackgroundColor:'#00000000',
      viewport:{x:-310,y:-136,width:620,height:272,padLeft:'0%',padRight:'0%',padTop:'0%',padBottom:'0%'},
      success(instance){if(reducedMotion)instance.pause()}
    });
  </script>
</body>
</html>
