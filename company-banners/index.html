<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>有春首頁 Spine Banner</title>
    <link rel="stylesheet" href="./spine-player.css" />
    <style>
      :root { color-scheme: dark; font-family: Inter, "PingFang TC", "Microsoft JhengHei", sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #02060d; color: #f5f8ff; }
      body { min-height: 100vh; }
      main { width: min(100%, 1320px); margin: 0 auto; padding: 32px 24px 56px; }
      h1 { margin: 0 0 24px; font-size: clamp(24px, 4vw, 38px); }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
      article { min-width: 0; overflow: hidden; border: 1px solid #283b54; border-radius: 14px; background: #070d17; box-shadow: 0 18px 42px rgba(0, 0, 0, .36); }
      .banner { width: 100%; aspect-ratio: 620 / 272; overflow: hidden; background: #000; }
      .player { width: 100%; height: 100%; }
      h2 { margin: 0; padding: 13px 16px 15px; font-size: 17px; }
      @media (max-width: 820px) {
        main { padding: 18px 12px 36px; }
        .grid { grid-template-columns: 1fr; gap: 16px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>有春首頁 Spine Banner</h1>
      <section class="grid" aria-label="公司首頁 Banner 合集">
        <article>
          <div class="banner"><div class="player" id="headframe"></div></div>
          <h2>頭框活動</h2>
        </article>
        <article>
          <div class="banner"><div class="player" id="atg"></div></div>
          <h2>ATG 投注榜</h2>
        </article>
        <article>
          <div class="banner"><div class="player" id="line"></div></div>
          <h2>加入 LINE</h2>
        </article>
      </section>
    </main>

    <script src="./spine-player.js"></script>
    <script>
      const common = {
        animation: "animation",
        loop: true,
        alpha: false,
        premultipliedAlpha: false,
        showControls: false,
        backgroundColor: "#000000"
      };

      new spine.SpinePlayer("headframe", {
        ...common,
        jsonUrl: "./headframe.json",
        atlasUrl: "./headframe.atlas",
        viewport: { x: -310, y: -136, width: 620, height: 272, padLeft: "0%", padRight: "0%", padTop: "0%", padBottom: "0%" }
      });

      new spine.SpinePlayer("atg", {
        ...common,
        jsonUrl: "./atg.json",
        atlasUrl: "./atg.atlas",
        viewport: { x: -310, y: -136, width: 620, height: 272, padLeft: "0%", padRight: "0%", padTop: "0%", padBottom: "0%" }
      });

      new spine.SpinePlayer("line", {
        ...common,
        jsonUrl: "./line.json",
        atlasUrl: "./line.atlas",
        viewport: { x: -310.18, y: -136.11, width: 620.81, height: 271.61, padLeft: "0%", padRight: "0%", padTop: "0%", padBottom: "0%" }
      });
    </script>
  </body>
</html>
