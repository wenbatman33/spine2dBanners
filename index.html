<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spine Banner</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,"PingFang TC",sans-serif; background:#030712; color:#f4f8ff; }
    * { box-sizing:border-box; }
    body { margin:0; }
    [v-cloak] { display:none; }
    main { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; width:min(100%,1380px); margin:auto; padding:36px 26px; }
    article { min-width:0; overflow:hidden; border:1px solid #27496f; border-radius:16px; background:#071020; }
    article > .spine-banner { max-width:none; background:#020812; }
    footer { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px; }
    h2 { margin:0; font-size:17px; }
    button { border:1px solid #315b87; border-radius:8px; padding:6px 12px; background:#0b1d36; color:#86f7f0; cursor:pointer; font:inherit; white-space:nowrap; }
    button:hover { background:#12315a; }
    pre { margin:0 16px 16px; padding:12px; border:1px solid #1c3858; border-radius:10px; background:#020813; color:#bcd3ef; white-space:pre-wrap; overflow-wrap:anywhere; }
    code { font:12px/1.6 ui-monospace,monospace; }
    @media (max-width:840px) { main { grid-template-columns:1fr; } }
    @media (max-width:520px) { main { padding:16px 12px; gap:16px; } h2 { font-size:15px; } }
  </style>
</head>
<body>
  <main id="app" v-cloak>
    <article v-for="banner in banners" :key="banner.id">
      <spine-banner :id="banner.id"></spine-banner>
      <footer>
        <h2>{{ banner.name }}</h2>
        <button type="button" :aria-label="'複製' + banner.name + '的嵌入碼'" @click="copyBanner(banner.id)">
          {{ copyStatus[banner.id] || '複製' }}
        </button>
      </footer>
      <pre><code>{{ embedCode(banner.id) }}</code></pre>
    </article>
  </main>
  <noscript>請開啟 JavaScript 以查看 Banner。</noscript>
  <script type="module">
    import { createApp, ref, reactive, onBeforeUnmount } from "./banners/shared/vue.esm-browser.prod.js";
    import SpineBanner from "./banners/shared/SpineBanner.js";

    createApp({
      components: { SpineBanner },
      setup() {
        const banners = ref([
          { id: "15-cowboy-hat-tip", name: "15 · 狂野印第安對決" },
          { id: "14-temujin", name: "14 · 鐵木真" },
          { id: "13-airborne-strike", name: "13 · 凌空爆射" },
          { id: "12-flame-monkey", name: "12 · 烈焰猴王" },
          { id: "11-beauty-wink", name: "11 · 心動獎金眨眼挑戰" },
          { id: "10-operative-idle", name: "10 · 王牌特勤" },
          { id: "09-treasure-chest", name: "09 · 開箱暴擊" },
          { id: "08-forward-dribble", name: "08 · 一路帶球向前衝" },
          { id: "07-lucky-tiger", name: "07 · 福運小虎" },
          { id: "06-gift-goddess", name: "06 · 女神生日限定" },
          { id: "01-champions-night", name: "01 · 歐冠巔峰之夜" },
          { id: "02-star-summit", name: "02 · 群星巔峰夜" },
          { id: "03-rivalry", name: "03 · 豪門生死戰" },
          { id: "04-champion-road", name: "04 · 冠軍之路" },
          { id: "05-striker-storm", name: "05 · 鋒線風暴" }
        ]);
        const copyStatus = reactive({});
        const timers = new Map();
        const embedCode = (id) => `<spine-banner id="${id}"></spine-banner>`;

        async function copyBanner(id) {
          clearTimeout(timers.get(id));
          const snippet = embedCode(id);
          try {
            await navigator.clipboard.writeText(snippet);
            copyStatus[id] = "已複製";
          } catch (_) {
            const input = document.createElement("textarea");
            input.value = snippet;
            input.style.cssText = "position:fixed;left:-9999px;top:0";
            const focused = document.activeElement;
            document.body.append(input);
            input.select();
            try {
              copyStatus[id] = document.execCommand("copy") ? "已複製" : "請手動複製";
            } catch (_) {
              copyStatus[id] = "請手動複製";
            } finally {
              input.remove();
              focused?.focus({ preventScroll: true });
            }
          }
          timers.set(id, setTimeout(() => {
            delete copyStatus[id];
            timers.delete(id);
          }, 1200));
        }

        onBeforeUnmount(() => timers.forEach(clearTimeout));
        return { banners, copyStatus, embedCode, copyBanner };
      }
    }).mount("#app");
  </script>
</body>
</html>
