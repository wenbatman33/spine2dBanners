<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spine Banner</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,"PingFang TC",sans-serif; background:#030712; color:#f4f8ff; }
    * { box-sizing:border-box; }
    body { margin:0; }
    nav { width:min(100%,1380px); margin:auto; padding:20px 26px 0; text-align:right; }
    nav a { color:#86f7f0; text-decoration:none; }
    nav a:hover { text-decoration:underline; }
    [v-cloak] { display:none; }
    main { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; width:min(100%,1380px); margin:auto; padding:36px 26px; }
    article { min-width:0; overflow:hidden; border:1px solid #27496f; border-radius:16px; background:#071020; }
    article > .spine-banner { max-width:none; background:#020812; }
    footer { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px; }
    h2 { margin:0; font-size:17px; }
    button { border:1px solid #315b87; border-radius:8px; padding:6px 12px; background:#0b1d36; color:#86f7f0; cursor:pointer; font:inherit; white-space:nowrap; }
    button:hover { background:#12315a; }
    pre { margin:0 16px 16px; padding:12px; border:1px solid #1c3858; border-radius:10px; background:#020813; color:#bcd3ef; white-space:pre-wrap; overflow-wrap:anywhere; }
    code { font:12px/1.6 ui-monospace,monospace; }
    @media (max-width:840px) { main { grid-template-columns:1fr; } }
    @media (max-width:520px) { main { padding:16px 12px; gap:16px; } h2 { font-size:15px; } }
  </style>
</head>
<body>
  <nav><a href="./effect.html">效果預覽</a></nav>
  <main id="app" v-cloak>
    <article v-for="banner in banners" :key="banner.src">
      <spine-banner :src="banner.src"></spine-banner>
      <footer>
        <h2>{{ banner.name }}</h2>
        <button type="button" :aria-label="'複製' + banner.name + '的嵌入碼'" @click="copyBanner(banner.src)">
          {{ copyStatus[banner.src] || '複製' }}
        </button>
      </footer>
      <pre><code>{{ embedCode(banner.src) }}</code></pre>
    </article>
  </main>
  <noscript>請開啟 JavaScript 以查看 Banner。</noscript>
  <script type="module">
    import { createApp, ref, reactive, onBeforeUnmount } from "./banners/shared/vue.esm-browser.prod.js";
    import SpineBanner from "./banners/shared/SpineBanner.js?v=20260909-src-2";

    createApp({
      components: { SpineBanner },
      setup() {
        const banners = ref([
          { src: "./banners/15-cowboy-hat-tip/", name: "15 · 狂野印第安對決" },
          { src: "./banners/14-temujin/", name: "14 · 鐵木真" },
          { src: "./banners/13-airborne-strike/", name: "13 · 凌空爆射" },
          { src: "./banners/12-flame-monkey/", name: "12 · 烈焰猴王" },
          { src: "./banners/11-beauty-wink/", name: "11 · 心動獎金眨眼挑戰" },
          { src: "./banners/10-operative-idle/", name: "10 · 王牌特勤" },
          { src: "./banners/09-treasure-chest/", name: "09 · 開箱暴擊" },
          { src: "./banners/08-forward-dribble/", name: "08 · 一路帶球向前衝" },
          { src: "./banners/07-lucky-tiger/", name: "07 · 福運小虎" },
          { src: "./banners/06-gift-goddess/", name: "06 · 女神生日限定" },
          { src: "./banners/01-champions-night/", name: "01 · 歐冠巔峰之夜" },
          { src: "./banners/02-star-summit/", name: "02 · 群星巔峰夜" },
          { src: "./banners/03-rivalry/", name: "03 · 豪門生死戰" },
          { src: "./banners/04-champion-road/", name: "04 · 冠軍之路" },
          { src: "./banners/05-striker-storm/", name: "05 · 鋒線風暴" }
        ]);
        const copyStatus = reactive({});
        const timers = new Map();
        const embedCode = (src) => `<spine-banner src="${src}"></spine-banner>`;

        async function copyBanner(src) {
          clearTimeout(timers.get(src));
          const snippet = embedCode(src);
          try {
            await navigator.clipboard.writeText(snippet);
            copyStatus[src] = "已複製";
          } catch (_) {
            const input = document.createElement("textarea");
            input.value = snippet;
            input.style.cssText = "position:fixed;left:-9999px;top:0";
            const focused = document.activeElement;
            document.body.append(input);
            input.select();
            try {
              copyStatus[src] = document.execCommand("copy") ? "已複製" : "請手動複製";
            } catch (_) {
              copyStatus[src] = "請手動複製";
            } finally {
              input.remove();
              focused?.focus({ preventScroll: true });
            }
          }
          timers.set(src, setTimeout(() => {
            delete copyStatus[src];
            timers.delete(src);
          }, 1200));
        }

        onBeforeUnmount(() => timers.forEach(clearTimeout));
        return { banners, copyStatus, embedCode, copyBanner };
      }
    }).mount("#app");
  </script>
</body>
</html>
