<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>烈焰猴王 · 自然動態示範</title>
    <link rel="stylesheet" href="./spine-player.css" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #02050b; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
      .banner {
        position: relative;
        width: min(1240px, calc(100vw - 40px));
        aspect-ratio: 620 / 272;
        overflow: hidden;
        border-radius: clamp(10px, 2vw, 22px);
        background: #090204;
        box-shadow: 0 30px 90px rgba(0, 0, 0, .66), 0 0 0 1px rgba(255, 185, 63, .38);
        isolation: isolate;
      }
      .background,
      .player { position: absolute; inset: 0; width: 100%; height: 100%; }
      .background { object-fit: cover; display: block; }
      .player { pointer-events: none; }
      .spine-player-controls { display: none !important; }
      @media (max-width: 680px) {
        body { padding: 0; background: #090204; }
        .banner { width: 100vw; border-radius: 0; }
      }
    </style>
  </head>
  <body>
    <main class="banner" aria-label="烈焰猴王榮耀限定挑戰動畫 Banner">
      <img class="background" src="./background.png" alt="烈焰猴王榮耀限定挑戰" />
      <div class="player" id="banner-player" aria-hidden="true"></div>
    </main>

    <script src="./spine-player.js"></script>
    <script>
      new spine.SpinePlayer("banner-player", {
        jsonUrl: "./banner.json",
        atlasUrl: "./banner.atlas",
        animation: "animation",
        loop: true,
        alpha: true,
        premultipliedAlpha: false,
        backgroundColor: "#00000000",
        fullScreenBackgroundColor: "#00000000",
        showControls: false,
        viewport: {
          x: -310,
          y: -136,
          width: 620,
          height: 272,
          padLeft: "0%",
          padRight: "0%",
          padTop: "0%",
          padBottom: "0%"
        }
      });
    </script>
  </body>
</html>
