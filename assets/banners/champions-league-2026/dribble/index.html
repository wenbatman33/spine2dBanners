<!doctype html>
<html lang="zh-CN">
  <head>

    <link rel="stylesheet" href="../player/vendor/spine-player-3.8.css" />
    <style>
      :root { color-scheme:dark; font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; background:#020812; color:#f3fbff; }

      body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 72% 15%,rgba(0,171,201,.34),transparent 38%),#020812; }

      #player { width:100%; aspect-ratio:620/272; overflow:hidden; border:1px solid rgba(66,224,230,.36); border-radius:18px; background:#020812; box-shadow:0 24px 80px rgba(0,0,0,.55); }
      .note { margin-top:12px; font-size:13px; color:#739bb7; }
    </style>
  </head>
  <body>
    <main>
      <h1>一路带球 · 向前冲！</h1>
      <p>8 格完整人体连续跑步；不再切割肩、臀、大腿，足球保持独立滚动图层。</p>
      <div id="player"></div>
      <div class="note">Spine 3.8.99 · 620×272 · 1.20 秒 · 8 格人物序列 · 足球旋转 720°</div>
    </main>
    <script src="../player/vendor/spine-player-3.8.js?retina=2"></script>
    <script>
      const freshAssets=Date.now();
      window.dribblePlayer = new spine.SpinePlayer("player",{
        jsonUrl:`../series/08-forward-dribble/spine-3.8/runtime/banner.json?fresh=${freshAssets}`,
        atlasUrl:`../series/08-forward-dribble/spine-3.8/runtime/banner.atlas?fresh=${freshAssets}`,
        animation:"animation",loop:true,alpha:true,premultipliedAlpha:false,showControls:false,backgroundColor:"#020812",
        viewport:{x:-310,y:-136,width:620,height:272,padLeft:"0%",padRight:"0%",padTop:"0%",padBottom:"0%"}
      });
    </script>
  </body>
</html>
