<!doctype html>

      #player { width:100%; aspect-ratio:620/272; overflow:hidden; border:1px solid rgba(89,241,151,.36); border-radius:18px; background:#02100a; box-shadow:0 24px 80px rgba(0,0,0,.55); }

    <main>
      <h1>福运小虎 · 签到领豪礼</h1>

      <div id="player"></div>

    <script src="../player/vendor/spine-player-3.8.js?retina=2"></script>
    <script>
      const freshAssets=Date.now();
      new spine.SpinePlayer("player",{
        jsonUrl:`../series/07-lucky-tiger/spine-3.8/runtime/banner.json?fresh=${freshAssets}`,
        atlasUrl:`../series/07-lucky-tiger/spine-3.8/runtime/banner.atlas?fresh=${freshAssets}`,
        animation:"animation",loop:true,alpha:true,premultipliedAlpha:false,showControls:true,backgroundColor:"#02100a",
        viewport:{x:-310,y:-136,width:620,height:272,padLeft:"0%",padRight:"0%",padTop:"0%",padBottom:"0%"}
      });
    </script>
  </body>
</html>
