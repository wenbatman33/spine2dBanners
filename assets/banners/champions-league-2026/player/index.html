<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>欧冠巅峰之夜 · Spine 3.8 Player</title>
    <link rel="stylesheet" href="./vendor/spine-player-3.8.css" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #030815;
        color: #eef6ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 25%, rgba(22, 76, 164, 0.42), transparent 46%),
          linear-gradient(180deg, #071226 0%, #02050d 100%);
      }

      main {
        width: min(100%, 900px);
        padding: 28px;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 14px;
      }

      h1 {
        margin: 0;
        font-size: clamp(20px, 3vw, 30px);
      }

      header p {
        margin: 0;
        color: #8da9cc;
        font-size: 14px;
      }

      .frame {
        overflow: hidden;
        border: 1px solid rgba(90, 166, 255, 0.42);
        border-radius: 16px;
        background: #050b17;
        box-shadow:
          0 28px 80px rgba(0, 0, 0, 0.55),
          0 0 50px rgba(31, 112, 255, 0.17);
      }

      #player {
        width: 100%;
        aspect-ratio: 620 / 272;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .meta span {
        padding: 6px 10px;
        border: 1px solid rgba(123, 174, 233, 0.22);
        border-radius: 999px;
        background: rgba(15, 35, 64, 0.72);
        color: #bcd2ed;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>欧冠巅峰之夜</h1>
        <p>Spine 3.8.99 Runtime Preview</p>
      </header>
      <section class="frame">
        <div id="player"></div>
      </section>
      <div class="meta" aria-label="动画信息">
        <span>620 × 272</span>
        <span>0.97 秒无缝循环</span>
        <span>6 个动画图层</span>
        <span>挥拳 · 爆闪 · 火花 · 推镜</span>
      </div>
    </main>

    <script src="./vendor/spine-player-3.8.js?retina=2"></script>
    <script>
      new spine.SpinePlayer("player", {
        jsonUrl: "../spine-3.8/runtime/champions-league-2026.json",
        atlasUrl: "../spine-3.8/runtime/champions-league-2026.atlas",
        animation: "animation",
        loop: true,
        alpha: true,
        showControls: true,
        backgroundColor: "#050b17",
        viewport: {
          x: -310,
          y: -136,
          width: 620,
          height: 272,
          padLeft: "0%",
          padRight: "0%",
          padTop: "0%",
          padBottom: "0%"
        }
      });
    </script>
  </body>
</html>
